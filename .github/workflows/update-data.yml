name: Update market data
on:
  schedule:
    # Every 8 hours → 3 runs/day (IST: ~07:30, 15:30, 23:30)
    - cron: "0 2 * * *"   # 07:30 IST
    - cron: "0 10 * * *"  # 15:30 IST
    - cron: "0 18 * * *"  # 23:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Fetch IPO
        run: python scripts/fetch_ipo.py
        continue-on-error: true
      - name: Fetch gold
        run: python scripts/fetch_gold.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipo.json data/gold.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh market data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
