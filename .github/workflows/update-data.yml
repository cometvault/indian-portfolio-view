name: Update market data nightly

on:
  schedule:
    # ~00:30 IST (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:  # manual trigger from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape IPO GMP (ipowatch)
        run: |
          python << 'EOF'
          import json, re, datetime
          from pathlib import Path
          try:
              import requests
              from bs4 import BeautifulSoup
          except ImportError:
              print("Missing deps")
              exit(1)

          url = "https://ipowatch.in/ipo-grey-market-premium-latest-ipo-gmp/"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; PortfolioViewBot/1.0; educational)"}
          try:
              r = requests.get(url, headers=headers, timeout=30)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, "lxml")
          except Exception as e:
              print("Fetch failed:", e)
              exit(0)

          def parse_table(heading_text):
              rows = []
              for h in soup.find_all(["h2", "h3", "h4"]):
                  if heading_text.lower() in h.get_text().lower():
                      table = h.find_next("table")
                      if not table:
                          continue
                      for tr in table.find_all("tr")[1:]:
                          cells = [td.get_text(strip=True) for td in tr.find_all(["td", "th"])]
                          if len(cells) < 6:
                              continue
                          name = re.sub(r"\s+", " ", cells[0]).strip()
                          gmp_raw = cells[1].replace("\u20b9", "").replace(",", "").strip()
                          gmp_m = re.search(r"-?\d+", gmp_raw)
                          gmp = int(gmp_m.group()) if gmp_m else 0
                          price = cells[3].replace("\u20b9", "").strip() if len(cells) > 3 else ""
                          est = cells[4] if len(cells) > 4 else ""
                          dates = cells[5] if len(cells) > 5 else ""
                          status = cells[6] if len(cells) > 6 else "\u2014"
                          if not name or name.lower().startswith("ipo"):
                              continue
                          rows.append({
                              "name": name,
                              "gmp": gmp,
                              "priceBand": price,
                              "estListing": est,
                              "dates": dates,
                              "status": status
                          })
                      break
              return rows

          mainboard = parse_table("Mainboard")
          sme = parse_table("SME")

          if not mainboard and not sme:
              print("No tables parsed \u2013 leaving existing data")
              exit(0)

          data = {
              "updated": datetime.date.today().isoformat(),
              "source": "ipowatch.in (auto)",
              "mainboard": mainboard or [],
              "sme": sme or []
          }
          Path("data/ipo.json").write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"Wrote {len(mainboard)} mainboard + {len(sme)} SME rows")
          EOF

      - name: Scrape gold rates (goodreturns.in)
        run: |
          python << 'EOF'
          import json, datetime, re, urllib.request
          from pathlib import Path

          CITIES = [
              ("Bangalore", "https://www.goodreturns.in/gold-rates/bangalore.html"),
              ("Mumbai", "https://www.goodreturns.in/gold-rates/mumbai.html"),
              ("Kolkata", "https://www.goodreturns.in/gold-rates/kolkata.html"),
              ("Hyderabad", "https://www.goodreturns.in/gold-rates/hyderabad.html"),
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 PortfolioView/1.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def parse_rates(html):
              m24 = re.search(r"\u20b9\s*([\d,]+)\s*per gram for 24 karat", html, re.I)
              m22 = re.search(r"\u20b9\s*([\d,]+)\s*per gram for 22 karat", html, re.I)
              if not m24:
                  m24 = re.search(r"24K[^\u20b9]*\u20b9\s*([\d,]+)", html)
              if not m22:
                  m22 = re.search(r"22K[^\u20b9]*\u20b9\s*([\d,]+)", html)
              def num(m):
                  return int(m.group(1).replace(",", "")) if m else None
              return num(m24), num(m22)

          cities = []
          for name, url in CITIES:
              try:
                  html = fetch(url)
                  r24, r22 = parse_rates(html)
                  if r24 and r22:
                      cities.append({"city": name, "rate24k": r24, "rate22k": r22, "change24k": 0})
                      print(f"{name}: 24K={r24} 22K={r22}")
                  else:
                      print(f"{name}: parse failed")
              except Exception as e:
                  print(f"{name}: error {e}")

          path = Path("data/gold.json")
          if cities:
              data = {
                  "updated": datetime.date.today().isoformat(),
                  "source": "goodreturns.in",
                  "note": "Per gram. Retail quotes vary by jeweller.",
                  "cities": cities,
              }
          elif path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              data["updated"] = datetime.date.today().isoformat()
              print("Kept previous rates; scrape empty")
          else:
              data = {"updated": datetime.date.today().isoformat(), "cities": []}

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding="utf-8")
          print("Gold JSON written")
          EOF

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipo.json data/gold.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: nightly market data update $(date -u +%Y-%m-%d)"
            git push
          fi
