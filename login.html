<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://accounts.google.com; frame-src https://accounts.google.com https://*.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/theme-font.css">
  <link rel="stylesheet" href="css/logo.css">
  <link rel="stylesheet" href="css/auth.css">
  <title>Login | Portfolio View</title>
  <meta name="description" content="Sign in with Google to save preferences.">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Portfolio View India">
        <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="19" fill="#0b1f3a"/>
          <circle cx="20" cy="20" r="12" stroke="#2563eb" stroke-width="7" stroke-dasharray="28.3 47.1" stroke-dashoffset="0" transform="rotate(-90 20 20)" fill="none"/>
          <circle cx="20" cy="20" r="12" stroke="#06b6d4" stroke-width="7" stroke-dasharray="25.1 50.3" stroke-dashoffset="-28.3" transform="rotate(-90 20 20)" fill="none"/>
          <circle cx="20" cy="20" r="12" stroke="#8b5cf6" stroke-width="7" stroke-dasharray="15.7 59.7" stroke-dashoffset="-53.4" transform="rotate(-90 20 20)" fill="none"/>
          <circle cx="20" cy="20" r="12" stroke="#f59e0b" stroke-width="7" stroke-dasharray="12.6 62.8" stroke-dashoffset="-69.1" transform="rotate(-90 20 20)" fill="none"/>
          <circle cx="20" cy="20" r="7.5" fill="#0b1f3a"/>
          <circle cx="20" cy="20" r="2.2" fill="#fff"/>
        </svg>
        <span class="logo-text">
          <span class="logo-name">Portfolio View</span>
          <span class="logo-tag">India</span>
        </span>
      </a>
      <nav>
        <a href="index.html">Overview</a>
        <a href="new-to-finance.html">New To Finance</a>
        <a href="ipo.html">IPOs</a>
        <a href="gold-etf.html">Gold & ETF</a>
        <a href="mutual-funds.html">Mutual Funds</a>
        <a href="equity.html">Equity</a>
        <span class="nav-auth" data-auth-nav></span>
      </nav>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="auth-wrap">
        <div class="auth-card">
          <h1>Sign in</h1>
          <p class="auth-lead">Continue with Google. Educational only — not advice.</p>
          <div class="auth-error" id="authError" role="alert"></div>
          <div class="auth-actions">
            <button type="button" class="btn btn-primary" id="googleBtn">Continue with Google</button>
          </div>
          <p class="auth-note">We only use your Google account to sign you in. No investment products are sold here.</p>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="container">
      <p>Educational only. Not advice. Not SEBI-registered.</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-client.js"></script>
  <script>
    (async function () {
      var err = document.getElementById('authError');
      var btn = document.getElementById('googleBtn');
      function showError(msg) {
        err.textContent = msg;
        err.classList.add('is-visible');
      }
      try {
        var session = await PVAuth.getSession();
        if (session) {
          window.location.replace('new-to-finance.html');
          return;
        }
      } catch (e) {}
      if (!PVAuth.isConfigured()) {
        showError('Google sign-in is not configured yet. Add Supabase URL and anon key in js/supabase-config.js');
        btn.disabled = true;
        return;
      }
      btn.addEventListener('click', async function () {
        err.classList.remove('is-visible');
        btn.disabled = true;
        var res = await PVAuth.signInWithGoogle();
        if (!res.ok) {
          showError(res.error || 'Could not start Google sign-in.');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
